<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:r="http://typo3.org/ns/NITSAN/NsFriendlycaptcha/ViewHelpers"
	  data-namespace-typo3-fluid="true">

	<r:form.friendlyCaptcha>
		<f:if condition="{showCaptcha}">
			<f:then>
				<button
					class="btn btn-primary {configuration.captchaCssClass}"
					data="{
						sitekey: '{configuration.public_key}',
						callback: configuration.invisibleCallback
					}"
				>###LLL:submit###</button>
			</f:then>
			<f:else>
				<button
					class="btn btn-primary"
				>###LLL:submit###</button>
				<div class="friendlycaptcha-development-mode">
					<f:translate key="LLL:EXT:ns_friendlycaptcha/Resources/Private/Language/locallang.xlf:development_mode_active" />
				</div>
			</f:else>
		</f:if>
	</r:form.friendlyCaptcha>

</html>
